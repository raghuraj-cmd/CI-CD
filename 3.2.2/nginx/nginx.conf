events {
    worker_connections 1024;
}

http {
    # Upstream pool for weighted canary traffic (90% stable, 10% canary)
    upstream weighted_backend {
        server app-stable:8080 weight=9 max_fails=3 fail_timeout=10s;
        server app-canary:8080 weight=1 max_fails=3 fail_timeout=10s;
    }

    # Dedicated upstream for explicit Canary testing (via header X-Canary: always)
    upstream canary_backend {
        server app-canary:8080 max_fails=3 fail_timeout=10s;
    }

    # Dedicated upstream for explicit Stable traffic
    upstream stable_backend {
        server app-stable:8080 max_fails=3 fail_timeout=10s;
    }

    # Map X-Canary header to target upstream backend
    map $http_x_canary $pool {
        "always" canary_backend;
        "true"   canary_backend;
        "never"  stable_backend;
        "false"  stable_backend;
        default  weighted_backend;
    }

    server {
        listen 8080;
        server_name localhost;

        # Reverse proxy to selected upstream pool
        location / {
            proxy_pass http://$pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Expose Canary debugging headers to clients
            add_header X-Routed-Pool $pool always;
            add_header X-Served-By $upstream_addr always;
        }

        # Health check endpoint for Canary Router
        location /router-health {
            access_log off;
            return 200 '{"status":"UP","component":"canary-reverse-proxy"}\n';
            add_header Content-Type application/json;
        }
    }
}

