# Application Details
spring.application.name=cd-pipeline-demo
app.version=1.0.0
app.environment=${APP_ENV:local}
app.deployment.type=${APP_DEPLOYMENT_TYPE:STABLE}

server.port=${PORT:8080}

# Spring Boot Actuator Configuration for CD Health Checks & Probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Info Contributor
info.app.name=${spring.application.name}
info.app.version=${app.version}
info.app.environment=${app.environment}

# H2 In-Memory (Local Profile)
spring.datasource.url=jdbc:h2:mem:cddb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
